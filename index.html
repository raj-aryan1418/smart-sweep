<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Mobile Viewport Optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1310" media="(prefers-color-scheme: dark)" />

    <!-- Primary SEO Meta Tags -->
    <title>SmartSweep - Smart Municipal Solid Waste Management & Sanitation Platform</title>
    <meta name="title" content="SmartSweep - Smart Municipal Solid Waste Management & Sanitation Platform" />
    <meta name="description" content="Smart municipal solid waste management platform. Report public garbage hotspots with GPS, book doorstep bulk waste pickup, track live sanitation crew dispatches, and view ward collection timetables." />
    <meta name="keywords" content="municipal waste management, solid waste cleanup, citizen garbage complaint, smart city cleanliness, BBMP waste pickup, bulk debris collection, waste segregation timetable, sanitation crew tracker, municipal services" />
    <meta name="author" content="SmartSweep Municipal Systems" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://smartsweep-frontend.vercel.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://smartsweep-frontend.vercel.app/" />
    <meta property="og:title" content="SmartSweep - Smart Municipal Solid Waste Management" />
    <meta property="og:description" content="Report public garbage hotspots, book doorstep bulk waste pickups, and track live BBMP sanitation crew GPS dispatches." />
    <meta property="og:image" content="/favicon.svg" />
    <meta property="og:site_name" content="SmartSweep" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://smartsweep-frontend.vercel.app/" />
    <meta name="twitter:title" content="SmartSweep - Smart Municipal Solid Waste Management" />
    <meta name="twitter:description" content="Report public garbage hotspots, book doorstep bulk waste pickups, and track live BBMP sanitation crew GPS dispatches." />
    <meta name="twitter:image" content="/favicon.svg" />

    <!-- Schema.org JSON-LD Structured Data for Government Service & Web Application -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://smartsweep-frontend.vercel.app/#website",
            "url": "https://smartsweep-frontend.vercel.app/",
            "name": "SmartSweep",
            "description": "Smart Municipal Solid Waste Management & Sanitation Platform",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://smartsweep-frontend.vercel.app/my-complaints?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "GovernmentService",
            "@id": "https://smartsweep-frontend.vercel.app/#service",
            "name": "Municipal Solid Waste Management & Doorstep Pickup",
            "serviceType": "Public Sanitation & Waste Disposal",
            "provider": {
              "@type": "GovernmentOrganization",
              "name": "Municipal Solid Waste Authority (BBMP)"
            },
            "areaServed": {
              "@type": "City",
              "name": "Bengaluru"
            },
            "hasOfferCatalog": {
              "@type": "OfferCatalog",
              "name": "Municipal Sanitation Services",
              "itemListElement": [
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Public Waste Issue Reporting"
                  }
                },
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Bulk Debris & Furniture Doorstep Pickup"
                  }
                },
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Ward Segregation Collection Calendar"
                  }
                }
              ]
            }
          }
        ]
      }
    </script>

    <!-- Typography & Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
